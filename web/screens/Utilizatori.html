<!-- title: Utilizatori -->
<style>
.th{padding:8px 12px;font-weight:600;font-size:12px;color:#5B6472;text-align:left;white-space:nowrap}
.td{padding:10px 12px;border-top:1px solid #EEF0F3;vertical-align:middle}
.in{box-sizing:border-box;height:38px;border:1px solid #D3D8E0;border-radius:10px;padding:0 12px;font:inherit;background:#FFFFFF;color:#0B0F1A;min-width:0}
.lk{border:0;background:none;padding:4px 6px;font:inherit;font-size:13px;font-weight:600;color:#0B6B4A;cursor:pointer;border-radius:8px}
.lk:hover{background:#EEF0F3}
.lk.red{color:#B42318}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
</style>

<template>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 class="hd" style="margin: 0; font-size: 30px; font-weight: 700">Utilizatori</h1>
<div style="color: #5B6472">Cine are acces la platformă. Intrarea se face cu un cod primit pe email; aici decizi ale cui emailuri sunt primite.</div>
</header>

<sc-if value="{{err}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="border-radius: 12px; background: #FFF1E8; color: #7C2D12; padding: 12px 14px; line-height: 1.5">{{err}}</div>
</sc-if>

<section class="cd" aria-labelledby="u-add" style="padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="u-add" class="hd" style="margin: 0; font-size: 18px; font-weight: 700">Adaugă un utilizator</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 4px; flex: 2 1 220px; font-size: 12px; font-weight: 600; color: #5B6472">Email
<input class="in" type="email" value="{{fEmail}}" onChange="{{onEmail}}" placeholder="nume@firma.ro" autocomplete="off">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; flex: 2 1 180px; font-size: 12px; font-weight: 600; color: #5B6472">Nume
<input class="in" type="text" value="{{fNume}}" onChange="{{onNume}}" placeholder="opțional" autocomplete="off">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 150px; font-size: 12px; font-weight: 600; color: #5B6472">Rol
<select class="in" value="{{fRol}}" onChange="{{onRol}}">
<option value="utilizator">Utilizator</option>
<option value="admin">Administrator</option>
</select>
</label>
<button class="bt fx" onClick="{{add}}" disabled="{{addDisabled}}" style="{{addStyle}}">Adaugă</button>
</div>
<div style="font-size: 13px; color: #5B6472; line-height: 1.5">Utilizatorii lucrează în toată platforma. Administratorii pot, în plus, să adauge și să scoată utilizatori.</div>
</section>

<section class="cd" aria-labelledby="u-list" style="padding: 6px 0 10px">
<h2 id="u-list" class="hd" style="margin: 0; padding: 14px 20px 8px; font-size: 18px; font-weight: 700">{{listTitle}}</h2>
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<div style="padding: 8px 20px; color: #5B6472">Se încarcă…</div>
</sc-if>
<div style="overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; min-width: 640px">
<thead><tr>
<th scope="col" class="th" style="padding-left: 20px">Utilizator</th>
<th scope="col" class="th">Rol</th>
<th scope="col" class="th">Stare</th>
<th scope="col" class="th">Ultima intrare</th>
<th scope="col" class="th" style="padding-right: 20px; text-align: right">Acțiuni</th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="u" hint-placeholder-count="3">
<tr style="{{u.rowStyle}}">
<th scope="row" class="td" style="padding-left: 20px; text-align: left; font-weight: 400">
<div style="font-weight: 600">{{u.title}}</div>
<sc-if value="{{u.sub}}" hint-placeholder-val="{{ true }}"><div style="font-size: 13px; color: #5B6472">{{u.sub}}</div></sc-if>
</th>
<td class="td">{{u.rolLabel}}</td>
<td class="td"><span class="pill" style="{{u.pillStyle}}">{{u.stare}}</span></td>
<td class="td" style="color: #5B6472">{{u.seen}}</td>
<td class="td" style="padding-right: 20px; text-align: right; white-space: nowrap">
<sc-if value="{{u.self}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #5B6472">contul tău</span></sc-if>
<sc-if value="{{u.other}}" hint-placeholder-val="{{ true }}">
<button class="lk" onClick="{{u.toggleRol}}" disabled="{{busy}}">{{u.rolAction}}</button>
<button class="lk" onClick="{{u.toggleActiv}}" disabled="{{busy}}">{{u.activAction}}</button>
<button class="lk red" onClick="{{u.remove}}" disabled="{{busy}}">Șterge</button>
</sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</main>
</template>

<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { users: [], loading: true, busy: false, err: '', fEmail: '', fNume: '', fRol: 'utilizator' };
  }
  componentDidMount() { this.load(); }
  async load() {
    try {
      const r = await API.get('/api/users');
      this.setState({ users: r.users || [], loading: false });
    } catch (e) {
      this.setState({ loading: false, err: this.msg(e, 'Nu am putut încărca lista de utilizatori.') });
    }
  }
  msg(e, fallback) { return (e && e.info && e.info.error) || fallback; }
  async act(fn) {
    if (this.state.busy) return;
    this.setState({ busy: true, err: '' });
    try { await fn(); await this.load(); } catch (e) { this.setState({ err: this.msg(e, 'Operațiunea nu a reușit. Încearcă din nou.') }); }
    this.setState({ busy: false });
  }
  add() {
    const s = this.state;
    const email = s.fEmail.trim().toLowerCase();
    if (!/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(email)) { this.setState({ err: 'Adresa de email nu este validă.' }); return; }
    this.act(async () => {
      await API.send('POST', '/api/users', { email, nume: s.fNume.trim(), rol: s.fRol });
      this.setState({ fEmail: '', fNume: '', fRol: 'utilizator' });
    });
  }
  patch(u, data) { this.act(() => API.send('PATCH', '/api/users/' + encodeURIComponent(u.email), data)); }
  remove(u) {
    if (!window.confirm('Ștergi definitiv utilizatorul ' + u.email + '? Nu va mai putea intra în platformă.')) return;
    this.act(() => API.send('DELETE', '/api/users/' + encodeURIComponent(u.email)));
  }
  renderVals() {
    const s = this.state;
    const when = (iso) => (iso ? new Date(iso).toLocaleString('ro-RO', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'niciodată');
    const active = s.users.filter((u) => u.activ).length;
    const can = !!s.fEmail.trim() && !s.busy;
    return {
      err: s.err,
      loading: s.loading,
      busy: s.busy,
      fEmail: s.fEmail, fNume: s.fNume, fRol: s.fRol,
      onEmail: (e) => this.setState({ fEmail: e.target.value }),
      onNume: (e) => this.setState({ fNume: e.target.value }),
      onRol: (e) => this.setState({ fRol: e.target.value }),
      add: () => this.add(),
      addDisabled: !can,
      addStyle: 'border:0;' + (can ? 'background:#0B6B4A;color:#FFFFFF' : 'background:#D3D8E0;color:#5B6472;cursor:not-allowed'),
      listTitle: s.loading ? 'Utilizatori' : 'Utilizatori (' + active + ' activi din ' + s.users.length + ')',
      rows: s.users.map((u) => {
        const self = u.email === ME.email;
        const admin = u.rol === 'admin';
        return {
          title: u.nume || u.email,
          sub: u.nume ? u.email : '',
          rolLabel: admin ? 'Administrator' : 'Utilizator',
          stare: u.activ ? 'Activ' : 'Dezactivat',
          pillStyle: u.activ ? 'background:#E7F6EE;color:#0B6B4A' : 'background:#EEF0F3;color:#5B6472',
          rowStyle: u.activ ? '' : 'opacity:.65',
          seen: when(u.last_seen),
          self, other: !self,
          rolAction: admin ? 'Fă utilizator' : 'Fă administrator',
          toggleRol: () => this.patch(u, { rol: admin ? 'utilizator' : 'admin' }),
          activAction: u.activ ? 'Dezactivează' : 'Activează',
          toggleActiv: () => this.patch(u, { activ: !u.activ }),
          remove: () => this.remove(u)
        };
      })
    };
  }
}
</script>
