<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null, bSel: undefined, bDone: {}, bDemo: false }; }
  bdays(d) {
    const s = this.state;
    const BACK = 5, AHEAD = 14;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const off = (dt) => Math.round((dt - today) / 86400000);
    const real = (d && d.birthdays) || [];
    const hasReal = real.length > 0;
    let src = [];
    if (hasReal) {
      real.forEach((c, i) => {
        const p = String(c.bd || '').split('.');
        const day = +p[0], mon = +p[1], yr = +p[2] || 0;
        if (!day || !mon) return;
        for (let y = today.getFullYear() - 1; y <= today.getFullYear() + 1; y++) {
          const o = off(new Date(y, mon - 1, day));
          if (o >= -BACK && o <= AHEAD) {
            const parts = c.n.split(' ');
            src.push({ id: 'c' + (c.cid || i) + '-' + y, n: c.n, fn: parts.length > 1 ? parts[1].split('-')[0] : parts[0], t: c.t || '', off: o, age: yr ? y - yr : 0, demo: false });
            break;
          }
        }
      });
    } else if (s.bDemo) {
      src = [[-4, 'Maria', 38], [-2, 'Andrei', 45], [-1, 'Ioana', 31], [0, 'Mihai', 40], [0, 'Elena', 52], [1, 'Radu', 36], [3, 'Cristina', 29], [6, 'Vlad', 47], [9, 'Alina', 34], [12, 'George', 60]]
        .map((x, i) => ({ id: 'demo' + i, n: x[1] + ' Exemplu', fn: x[1], t: '', off: x[0], age: x[2], demo: true }));
    }
    src.sort((a, b) => a.off - b.off);
    // La deschidere e selectată ziua de azi; dacă azi nu e nimeni, prima zi care urmează cu aniversări.
    // bSel === null înseamnă „toată perioada” (după ce deselectezi o zi).
    let sel = s.bSel;
    if (sel === undefined) {
      const next = src.find((x) => x.off >= 0);
      sel = src.some((x) => x.off === 0) || !next ? 0 : next.off;
    }
    const WD = ['dum', 'lun', 'mar', 'mie', 'joi', 'vin', 'sâm'];
    const MO = ['ian', 'feb', 'mar', 'apr', 'mai', 'iun', 'iul', 'aug', 'sep', 'oct', 'noi', 'dec'];
    const dateAt = (o) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + o);
    const bDays = [];
    for (let o = -BACK; o <= AHEAD; o++) {
      const dt = dateAt(o);
      const cnt = src.filter((x) => x.off === o).length;
      const on = sel === o;
      bDays.push({
        wd: o === 0 ? 'azi' : WD[dt.getDay()], num: dt.getDate(), cnt: cnt || '',
        pressed: on ? 'true' : 'false',
        aria: dt.getDate() + ' ' + MO[dt.getMonth()] + ', ' + cnt + (cnt === 1 ? ' zi de naștere' : ' zile de naștere'),
        badge: 'display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;border-radius:999px;font-size:10px;font-weight:700;' + (cnt ? (o < 0 ? 'background:#FF8A4C;color:#0B0F1A' : (on ? 'background:#FFFFFF;color:#0B0F1A' : 'background:#0B0F1A;color:#FFFFFF')) : 'display:none'),
        style: 'all:unset;position:relative;box-sizing:border-box;cursor:pointer;flex:1 0 44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;' +
          (on ? 'background:#0B0F1A;color:#FFFFFF;border:2px solid #0B0F1A' : (o === 0 ? 'background:#D8C07A;color:#0B0F1A;border:2px solid #0B0F1A' : (o < 0 ? 'background:#F2F4F7;color:#5B6472;border:2px solid #F2F4F7' : 'background:#FFFFFF;color:#10151C;border:2px solid #E4E7EC'))),
        pick: () => this.setState({ bSel: on ? null : o })
      });
    }
    const sender = this.props.expeditor ?? 'Cristi Popescu de la Kiwi';
    const NEAR = 3;
    const far = src.filter((x) => x.off > NEAR).length;
    const shown = sel !== null ? src.filter((x) => x.off === sel) : (s.bAll ? src : src.filter((x) => x.off <= NEAR));
    const bList = shown.map((x) => {
      const dt = dateAt(x.off);
      const when = x.off === 0 ? 'Azi' : (x.off === -1 ? 'Ieri' : (x.off < 0 ? 'Acum ' + (-x.off) + ' zile' : (x.off === 1 ? 'Mâine' : 'Peste ' + x.off + ' zile')));
      const msg = x.off < 0
        ? 'La mulți ani, ' + x.fn + ', chiar dacă cu puțină întârziere! Multă sănătate și numai bine. ' + sender
        : 'La mulți ani, ' + x.fn + '! Multă sănătate, bucurii și tot ce îți dorești. ' + sender;
      const digits = x.t.replace(/\D/g, '');
      const done = !!s.bDone[x.id];
      return {
        n: x.n + (x.demo ? ' · exemplu' : ''), ini: x.fn.charAt(0).toUpperCase(),
        sub: dt.getDate() + ' ' + MO[dt.getMonth()] + (x.age ? ' · ' + x.age + ' de ani' : ''),
        when,
        nameStyle: 'font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + (done ? 'color:#5B6472' : ''),
        av: 'flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;' + (x.off === 0 ? 'background:#D8C07A;color:#0B0F1A' : 'background:#0B0F1A;color:#FFFFFF'),
        pill: 'flex:0 0 auto;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;' + (x.off === 0 ? 'background:#D8C07A;color:#0B0F1A' : (x.off < 0 ? 'background:#FFF1E8;color:#9A3412' : 'background:#FFFFFF;color:#3D4653')),
        canSend: x.off <= 0,
        wa: 'https://wa.me/' + (digits.length >= 9 ? (digits.charAt(0) === '0' ? '40' + digits.slice(1) : digits) : '') + '?text=' + encodeURIComponent(msg),
        pressed: done ? 'true' : 'false', doneAria: done ? 'Felicitat, apasă pentru a anula' : 'Marchează ca felicitat',
        doneStyle: 'all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;' + (done ? 'background:#0B6B4A;color:#FFFFFF;border:1px solid #0B6B4A' : 'background:#FFFFFF;color:#8A93A1;border:1px solid #D3D8E0'),
        toggle: () => this.setState({ bDone: { ...this.state.bDone, [x.id]: !done } })
      };
    });
    const nToday = src.filter((x) => x.off === 0).length;
    const nLate = src.filter((x) => x.off < 0 && !s.bDone[x.id]).length;
    return {
      bDays, bList,
      bSummary: 'ultimele ' + BACK + ' zile și următoarele ' + AHEAD + (src.length ? ' · ' + nToday + ' azi · ' + nLate + ' de recuperat' : ''),
      bNoData: !hasReal,
      bNote: 'Datele de naștere nu sunt încă importate din eKIWI.' + (s.bDemo ? ' Persoanele de mai jos sunt exemple fictive, ca să vezi cum va arăta calendarul.' : ' După import, clienții apar aici automat.'),
      bDemoL: s.bDemo ? 'Ascunde exemplele' : 'Arată exemple',
      bToggleDemo: () => this.setState({ bDemo: !s.bDemo, bSel: undefined }),
      bHasMore: sel === null && far > 0,
      bMoreL: s.bAll ? 'Arată mai puține' : 'Arată și următoarele ' + far,
      bToggleAll: () => this.setState({ bAll: !s.bAll }),
      bEmpty: bList.length === 0,
      bEmptyText: sel !== null ? 'Nicio zi de naștere în ziua aleasă.' : 'Nicio zi de naștere în această perioadă.'
    };
  }
  componentDidMount() {
    DATA.load('core').then((d) => this.setState({ d })).catch(() => {});
  }
  fmt(n) { return Math.round(n).toLocaleString('ro-RO'); }
  mil(n) { return (n / 1e6).toLocaleString('ro-RO', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  bk(b) {
    const M = { 'UNICREDIT BANK': 'UniCredit', 'OTP BANK ROMANIA': 'OTP Bank', 'ALPHA BANK': 'Alpha Bank', 'GARANTI BANK': 'Garanti BBVA', 'SALT BANK': 'Salt Bank', 'INTESA SANPAOLO': 'Intesa Sanpaolo', 'RAIFFEISEN BANK': 'Raiffeisen', 'ING BANK': 'ING', 'BANCA TRANSILVANIA': 'Banca Transilvania', 'LIBRA INTERNET BANK': 'Libra Bank' };
    return M[b] || b;
  }
  renderVals() {
    const accent = this.props.accent ?? '#D8C07A';
    const d = this.state.d;
    const B = this.bdays(d);
    if (!d) return { ...B, asOf: '…', yr: '', yrPrev: '', k: { open: '—', openSub: 'Se încarcă…', vol: '—', volDelta: '', volDeltaStyle: '', conv: '—', convSub: '', radar: '—' }, months: [], calls: [], stages: [], banks: [], stale: 'Se încarcă…' };
    const P = d.pipeline;
    const cnt = (st) => P.filter((x) => x.st === st);
    const delta = d.ytd.sumPrev ? (d.ytd.sum / d.ytd.sumPrev - 1) * 100 : 0;
    const pc = (v) => (v === null || v === undefined ? '—' : v.toLocaleString('ro-RO') + '%');
    const k = {
      open: P.length,
      openSub: cnt('nou').length + ' noi · ' + cnt('analiza').length + ' în analiză · ' + cnt('aprobat').length + ' aprobate · ' + cnt('tras').length + ' trase',
      vol: this.mil(d.ytd.sum) + ' mil.',
      volDelta: (delta > 0 ? '+' : '') + delta.toLocaleString('ro-RO', { maximumFractionDigits: 1 }) + '%',
      volDeltaStyle: 'color:' + (delta >= 0 ? '#0B6B4A' : '#9A3412'),
      conv: pc(d.ytd.conv),
      convSub: pc(d.ytd.convPrev) + ' în ' + (d.year - 1) + ' · din dosarele închise',
      radar: d.radar.urgent.n
    };
    const mx = Math.max.apply(null, d.months.map((m) => m.sum)) || 1;
    const months = d.months.map((m, i) => ({
      l: m.l, v: this.mil(m.sum), n: m.trase,
      bar: 'width:100%;max-width:46px;border-radius:9px 9px 4px 4px;height:' + Math.max(4, Math.round(m.sum / mx * 150)) + 'px;' +
        (i === d.months.length - 1 ? 'background:' + accent + ';border:1px solid #0B0F1A;box-sizing:border-box' : 'background:#0B0F1A')
    }));
    const calls = d.radarTop.slice(0, 6).map((r) => ({
      n: r.n, z: r.z + ' zile',
      sub: this.bk(r.b) + ' · ' + this.fmt(r.s) + ' lei · fixa expiră ' + r.ex,
      tel: r.t ? 'tel:' + r.t.replace(/\s/g, '') : '#Radar',
      aria: 'Sună ' + r.n
    }));
    const ST = [['nou', 'Nou'], ['analiza', 'Analiză bancă'], ['aprobat', 'Aprobat'], ['tras', 'Tras, de reconciliat']];
    const stages = ST.map((s) => {
      const list = cnt(s[0]);
      return { l: s[1], n: list.length, sum: this.mil(list.reduce((a, x) => a + x.s, 0)) + ' mil.', bar: 'height:100%;border-radius:999px;background:#0B0F1A;width:' + Math.max(2, Math.round(list.length / (P.length || 1) * 100)) + '%' };
    });
    const old = cnt('nou').filter((x) => x.z > 90).length;
    const b26 = (d.banks[String(d.year)] || []).filter((b) => b.sum > 0).slice(0, 5);
    const bmx = b26.length ? b26[0].sum : 1;
    const banks = b26.map((b) => ({ l: this.bk(b.b), sum: this.mil(b.sum) + ' mil.', n: b.trase, conv: b.conv === null ? '—' : Math.round(b.conv) + '%', bar: 'height:100%;border-radius:999px;background:#0B0F1A;width:' + Math.round(b.sum / bmx * 100) + '%' }));
    return { ...B, asOf: d.asOf, yr: d.year, yrPrev: d.year - 1, k, months, calls, stages, banks, stale: old + ' dosare cu status „Nou” au peste 90 de zile de la depunere. Merită închise sau actualizate în eKIWI, ca să nu strice statistica.' };
  }
}
Component.persist = { bDone: 'main.bDone' };
</script>
